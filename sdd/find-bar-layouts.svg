<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1086" width="1000" height="1086" role="img" aria-label="Find bar layouts before and after the fidelity work: today's bar with a search field, previous and next buttons, a match count and a close button over a replace row; the new bar adding a history drop-down to each field, three option toggles for match case, whole word and regular expression, and a search-in-selection check box; the same bar wrapped onto extra rows at the window's minimum width; and the history drop-down open beneath the search field.">
  <title>Scribobulate find bar — layouts that change</title>
  <style>
    .panel  { fill: #f4f6f8; stroke: #c9d1db; }
    .bar    { fill: #ffffff; stroke: #9aa4b2; }
    .field  { fill: #ffffff; stroke: #7d97c4; }
    .btn    { fill: #e7effc; stroke: #7d97c4; }
    .btn-on { fill: #cfe0fb; stroke: #4c72ad; stroke-width: 2; }
    .new    { fill: #fdf3e3; stroke: #cfa95f; }
    .win    { fill: #eef1f5; stroke: #8f9aa9; }
    .t      { fill: #1c2230; font-family: "DejaVu Sans", "Segoe UI", system-ui, sans-serif; font-size: 13px; }
    .lbl    { fill: #5a6472; font-family: "DejaVu Sans", "Segoe UI", system-ui, sans-serif; font-size: 12px; }
    .dim    { fill: #8b95a3; font-family: "DejaVu Sans", "Segoe UI", system-ui, sans-serif; font-size: 13px; }
    .mono   { font-family: "DejaVu Sans Mono", "SFMono-Regular", Consolas, monospace; font-size: 12px; }
    .head   { fill: #3b4657; font-family: "DejaVu Sans", "Segoe UI", system-ui, sans-serif; font-size: 15px; font-weight: bold; }
    .rule   { stroke: #b9c2cd; fill: none; }
    .clk    { fill: none; stroke: #1c2230; }
    .clk-h  { fill: none; stroke: #1c2230; }

    @media (prefers-color-scheme: dark) {
      .panel  { fill: #171a20; stroke: #333b47; }
      .bar    { fill: #1f242c; stroke: #4a5563; }
      .field  { fill: #262c36; stroke: #5b7bb0; }
      .btn    { fill: #26364f; stroke: #5b7bb0; }
      .btn-on { fill: #37527d; stroke: #8fb0e6; stroke-width: 2; }
      .new    { fill: #33291a; stroke: #b08b45; }
      .win    { fill: #20242b; stroke: #56616f; }
      .t      { fill: #e6eaf1; }
      .lbl    { fill: #9aa4b2; }
      .dim    { fill: #6f7a89; }
      .head   { fill: #c6d0de; }
      .rule   { stroke: #3d4653; }
      .clk    { stroke: #e6eaf1; }
      .clk-h  { stroke: #e6eaf1; }
    }
  </style>

  <text class="head" x="30" y="30">Find bar — the surfaces this plan changes</text>
  <text class="lbl" x="30" y="48">Amber fill marks what is new. Everything else keeps its present position and behaviour.</text>

  <!-- ══ 1. Today ═══════════════════════════════════════════════════════════ -->
  <rect class="panel" x="30" y="64" width="940" height="170" rx="6"/>
  <text class="head" x="46" y="88">1 · Today</text>
  <text class="lbl" x="46" y="106">One case-insensitive literal query. Replace acts on the next match after the caret, not on the one highlighted.</text>

  <rect class="bar" x="46" y="116" width="908" height="102" rx="4"/>

  <rect class="field" x="62" y="128" width="250" height="30" rx="4"/>
  <text class="dim" x="74" y="148">Find…</text>
  <rect class="btn" x="322" y="128" width="30" height="30" rx="4"/>
  <text class="t" x="333" y="148">▲</text>
  <rect class="btn" x="358" y="128" width="30" height="30" rx="4"/>
  <text class="t" x="369" y="148">▼</text>
  <text class="t" x="400" y="148">3 of 12</text>
  <rect class="btn" x="470" y="128" width="30" height="30" rx="4"/>
  <text class="t" x="481" y="148">✕</text>

  <rect class="field" x="62" y="170" width="250" height="30" rx="4"/>
  <text class="dim" x="74" y="190">Replace with…</text>
  <rect class="btn" x="322" y="170" width="84" height="30" rx="4"/>
  <text class="t" x="337" y="190">Replace</text>
  <rect class="btn" x="414" y="170" width="104" height="30" rx="4"/>
  <text class="t" x="429" y="190">Replace All</text>

  <!-- ══ 2. After, wide window ══════════════════════════════════════════════ -->
  <rect class="panel" x="30" y="254" width="940" height="240" rx="6"/>
  <text class="head" x="46" y="278">2 · After — wide window</text>
  <text class="lbl" x="46" y="296">Three option toggles, a search-in-selection check box, and a history drop-down on each field.</text>

  <rect class="bar" x="46" y="306" width="908" height="102" rx="4"/>

  <rect class="field" x="62" y="318" width="226" height="30" rx="4"/>
  <text class="dim" x="74" y="338">Find…</text>
  <rect class="new" x="288" y="318" width="38" height="30" rx="4"/>
  <circle class="clk" cx="300" cy="333" r="6"/>
  <path class="clk-h" d="M 300 329 L 300 333 L 303 333"/>
  <text class="t" x="310" y="338">▾</text>

  <rect class="new" x="338" y="318" width="34" height="30" rx="4"/>
  <text class="t" x="346" y="338">Aa</text>
  <rect class="new" x="376" y="318" width="52" height="30" rx="4"/>
  <text class="t" x="384" y="338">Words</text>
  <rect class="new" x="432" y="318" width="56" height="30" rx="4"/>
  <text class="t" x="440" y="338">Reg-Ex</text>

  <rect class="new" x="498" y="325" width="16" height="16" rx="3"/>
  <text class="t" x="520" y="338">Search in selection</text>

  <rect class="btn" x="646" y="318" width="30" height="30" rx="4"/>
  <text class="t" x="657" y="338">▲</text>
  <rect class="btn" x="682" y="318" width="30" height="30" rx="4"/>
  <text class="t" x="693" y="338">▼</text>
  <text class="t" x="724" y="338">3 of 12</text>
  <rect class="btn" x="794" y="318" width="30" height="30" rx="4"/>
  <text class="t" x="805" y="338">✕</text>

  <rect class="field" x="62" y="360" width="226" height="30" rx="4"/>
  <text class="dim" x="74" y="380">Replace with…</text>
  <rect class="new" x="288" y="360" width="38" height="30" rx="4"/>
  <circle class="clk" cx="300" cy="375" r="6"/>
  <path class="clk-h" d="M 300 371 L 300 375 L 303 375"/>
  <text class="t" x="310" y="380">▾</text>
  <rect class="btn" x="338" y="360" width="84" height="30" rx="4"/>
  <text class="t" x="353" y="380">Replace</text>
  <rect class="btn" x="430" y="360" width="104" height="30" rx="4"/>
  <text class="t" x="445" y="380">Replace All</text>

  <text class="lbl" x="62" y="428"><tspan class="mono">Aa</tspan> match case — the one glyph kept, because it demonstrates what it names rather than standing for it</text>
  <text class="lbl" x="62" y="446"><tspan class="mono">Words</tspan> whole word only</text>
  <text class="lbl" x="62" y="464"><tspan class="mono">Reg-Ex</tspan> regular expression — GRegex, the engine the editor's search already compiles with</text>
  <text class="lbl" x="62" y="482">the check box confines the search to the selected passage; insensitive when there is no selection to confine it to</text>

  <!-- ══ 3. After, narrow window ════════════════════════════════════════════ -->
  <rect class="panel" x="30" y="514" width="460" height="332" rx="6"/>
  <text class="head" x="46" y="538">3 · After — at MIN_WINDOW_WIDTH</text>
  <text class="lbl" x="46" y="556">Both rows become wrap boxes and both fields are width-capped, so</text>
  <text class="lbl" x="46" y="572">the bar wraps rather than raising the window's minimum width (TDD 9.38).</text>

  <rect class="win" x="46" y="582" width="310" height="248" rx="4"/>
  <rect class="bar" x="54" y="590" width="294" height="232" rx="4"/>

  <rect class="field" x="62" y="600" width="226" height="28" rx="4"/>
  <text class="dim" x="74" y="619">Find…</text>
  <rect class="new" x="292" y="600" width="38" height="28" rx="4"/>
  <circle class="clk" cx="303" cy="614" r="6"/>
  <path class="clk-h" d="M 303 610 L 303 614 L 306 614"/>
  <text class="t" x="313" y="619">▾</text>

  <rect class="new" x="62" y="636" width="32" height="28" rx="4"/>
  <text class="t" x="69" y="655">Aa</text>
  <rect class="new" x="98" y="636" width="50" height="28" rx="4"/>
  <text class="t" x="105" y="655">Words</text>
  <rect class="new" x="152" y="636" width="54" height="28" rx="4"/>
  <text class="t" x="159" y="655">Reg-Ex</text>

  <rect class="new" x="62" y="678" width="15" height="15" rx="3"/>
  <text class="t" x="83" y="691">Search in selection</text>
  <rect class="btn" x="212" y="672" width="28" height="28" rx="4"/>
  <text class="t" x="221" y="691">▲</text>
  <rect class="btn" x="244" y="672" width="28" height="28" rx="4"/>
  <text class="t" x="253" y="691">▼</text>

  <text class="t" x="62" y="727">3 of 12</text>
  <rect class="btn" x="292" y="708" width="28" height="28" rx="4"/>
  <text class="t" x="301" y="727">✕</text>

  <path class="rule" d="M 62 746 L 340 746"/>

  <rect class="field" x="62" y="758" width="226" height="28" rx="4"/>
  <text class="dim" x="74" y="777">Replace with…</text>
  <rect class="new" x="292" y="758" width="38" height="28" rx="4"/>
  <circle class="clk" cx="303" cy="772" r="6"/>
  <path class="clk-h" d="M 303 768 L 303 772 L 306 772"/>
  <text class="t" x="313" y="777">▾</text>
  <rect class="btn" x="62" y="794" width="80" height="28" rx="4"/>
  <text class="t" x="75" y="813">Replace</text>
  <rect class="btn" x="146" y="794" width="100" height="28" rx="4"/>
  <text class="t" x="159" y="813">Replace All</text>

  <!-- ══ 4. History drop-down ═══════════════════════════════════════════════ -->
  <rect class="panel" x="510" y="514" width="460" height="296" rx="6"/>
  <text class="head" x="526" y="538">4 · History drop-down</text>
  <text class="lbl" x="526" y="556">Per tab, persisted with the tab. A term enters the list when it is</text>
  <text class="lbl" x="526" y="572">committed — Enter, Next/Prev, Replace — never on a keystroke.</text>

  <rect class="bar" x="526" y="582" width="428" height="212" rx="4"/>

  <rect class="field" x="542" y="594" width="226" height="30" rx="4"/>
  <text class="t" x="554" y="614">heading</text>
  <rect class="btn-on" x="768" y="594" width="24" height="30" rx="4"/>
  <text class="t" x="775" y="614">▴</text>

  <rect class="new" x="542" y="632" width="250" height="140" rx="5"/>
  <text class="t mono" x="556" y="656">heading</text>
  <path class="rule" d="M 542 670 L 792 670"/>
  <text class="t mono" x="556" y="686">^\s*#{1,3}\s</text>
  <text class="t mono" x="556" y="712">TODO</text>
  <text class="t mono" x="556" y="738">agent</text>
  <text class="lbl" x="556" y="762">most recent first · de-duplicated</text>

  <!-- ══ footer note ════════════════════════════════════════════════════════ -->
  <rect class="panel" x="30" y="866" width="940" height="128" rx="6"/>
  <text class="head" x="46" y="890">What does not change</text>
  <text class="lbl" x="46" y="914">The bar still lives in its revealer outside the content area, so it survives a view-mode switch. The search field stays a</text>
  <text class="lbl" x="46" y="934">GtkSearchEntry — its own Escape binding is what closes the bar (ScrAP-48) — so the history control is a button beside it</text>
  <text class="lbl" x="46" y="954">rather than a combo box, which would also be a deprecated widget. The replace row stays hidden until Ctrl+H, and</text>
  <text class="lbl" x="46" y="974">insensitive wherever the editor is not visible, because the preview is read-only.</text>

  <text class="lbl" x="30" y="1022">Each option control is one stateful win. action, so the find-bar button or box and the Edit menu item are two surfaces of one command,</text>
  <text class="lbl" x="30" y="1042">never two pieces of state. The options and both histories are per tab and persist with the tab; the captured selection bound</text>
  <text class="lbl" x="30" y="1062">and the live query do not, because neither survives the buffer it indexes.</text>
</svg>
